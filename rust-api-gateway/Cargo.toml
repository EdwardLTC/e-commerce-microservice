[package]
name = "rust-api-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"

# OpenAPI / Swagger
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gRPC client (tonic)
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"

# JWT
jsonwebtoken = "12"

# Redis
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Environment config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tonic-prost-build = "0.14"
